# Cache resized images at the edge with nginx in front of imgresize-api.
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:50m max_size=5g inactive=30d use_temp_path=off;

server {
    listen 443 ssl;
    server_name img.example.com;
    # ssl_certificate ...;

    location = /resize {
        limit_except GET HEAD { deny all; }      # keep uploads internal
        proxy_pass http://127.0.0.1:8080;
        proxy_cache img;
        proxy_cache_key "$request_uri$http_accept";   # format=auto varies on Accept
        proxy_cache_valid 200 7d;
        proxy_cache_valid 400 403 404 1m;
        proxy_cache_lock on;
        add_header X-Edge-Cache $upstream_cache_status;
    }

    location / { return 404; }
}
