name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test
        env:
          IMGRESIZE_SECRET: ci-only-secret-0123456789
        run: |
          imgresize --version
          imgresize check-config
          imgresize sign "/resize?url=https://example.com/a.jpg&w=300"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t imgresize-api:ci .
      - run: docker run --rm imgresize-api:ci --version
      - name: Start the container, probe /healthz and resize an upload
        run: |
          docker run -d --name imgresize -p 8080:8080 -e IMGRESIZE_ALLOW_UNSIGNED=true imgresize-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR4nGP8zwACTGCSAQANHQEDgslx/wAAAABJRU5ErkJggg=='))" > tiny.png
              curl -fsS -o out.webp --data-binary @tiny.png -H 'content-type: image/png' "http://127.0.0.1:8080/resize?w=1&format=webp"
              file out.webp | grep -q "Web/P"
              exit 0
            fi
            sleep 1
          done
          docker logs imgresize
          exit 1
