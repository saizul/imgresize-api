name: Feature request
description: Suggest a new transformation, output option or operational feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed parameters or settings
      description: For example a new query parameter (`blur=5`) or environment variable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
